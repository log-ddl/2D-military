<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720">
  <defs>
    <style><![CDATA[
      .ink { stroke: #181818; stroke-linecap: round; stroke-linejoin: round; }
      .outline { stroke: #181818; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .heavy { stroke: #181818; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .med { stroke: #181818; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .fine { stroke: #181818; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }

      /* ================= ANIMATIONS ================= */
      
      /* 1. Granny: Lac lu lat dat va mang mo sinh dong */
      #granny {
        animation: grannySway 2.6s ease-in-out infinite alternate;
        transform-origin: 300px 650px;
      }
      #granny-head {
        animation: grannyNod 0.65s ease-in-out infinite alternate;
        transform-origin: 145px 300px;
      }
      #granny-brows {
        animation: grannyBrowFrown 1.3s ease-in-out infinite alternate;
        transform-origin: 140px 175px;
      }
      #granny-eyes {
        animation: blink 3.5s infinite;
        transform-origin: 132px 198px;
      }
      #granny-mouth {
        animation: grannyMouthTalk 0.22s ease-in-out infinite alternate;
        transform-origin: 165px 242px;
      }

      /* 2. Man: Tho phap phong, chop mat ngo ngac va giat ria mep */
      #man {
        animation: manIdle 3.2s ease-in-out infinite alternate;
        transform-origin: 710px 650px;
      }
      #man-head {
        animation: manHeadTilt 2.8s ease-in-out infinite alternate;
        transform-origin: 140px 280px;
      }
      #man-eyes {
        animation: blink 4s infinite 1.2s;
        transform-origin: 140px 164px;
      }
      #man-mustache {
        animation: mustacheJiggle 0.9s ease-in-out infinite alternate;
        transform-origin: 140px 200px;
      }
      #man-belly {
        animation: bellyPulse 3.2s ease-in-out infinite alternate;
        transform-origin: 65px 420px;
      }

      /* KEYFRAME DEFINITIONS */
      @keyframes grannySway {
        0% { transform: translate(140px, 50px) rotate(-4deg); }
        50% { transform: translate(140px, 46px) rotate(-1deg); }
        100% { transform: translate(140px, 50px) rotate(-6deg); }
      }

      @keyframes grannyNod {
        0% { transform: rotate(0deg) translate(0px, 0px); }
        50% { transform: rotate(3deg) translate(2px, 3px); }
        100% { transform: rotate(-2deg) translate(-1px, -1px); }
      }

      @keyframes grannyBrowFrown {
        0% { transform: translateY(0px); }
        100% { transform: translateY(3px) scaleY(1.08); }
      }

      @keyframes grannyMouthTalk {
        0% { transform: scale(1) rotate(0deg); }
        100% { transform: scale(1.18, 0.85) rotate(-6deg); }
      }

      @keyframes manIdle {
        0% { transform: translate(560px, 50px) rotate(0deg); }
        50% { transform: translate(560px, 47px) rotate(1.5deg); }
        100% { transform: translate(560px, 50px) rotate(-1.5deg); }
      }

      @keyframes manHeadTilt {
        0% { transform: rotate(-1.5deg); }
        100% { transform: rotate(2deg); }
      }

      @keyframes mustacheJiggle {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(1.5px) rotate(1deg); }
        100% { transform: translateY(-0.5px) rotate(-1deg); }
      }

      @keyframes bellyPulse {
        0% { transform: scaleX(1); }
        50% { transform: scaleX(1.04); }
        100% { transform: scaleX(0.98); }
      }

      @keyframes blink {
        0%, 92%, 100% { transform: scaleY(1); }
        95% { transform: scaleY(0.08); }
      }
    ]]></style>
  </defs>

  <!-- Clean Background -->
  <rect width="960" height="720" fill="#f4f6f8"/>

  <!-- ================================================================= -->
  <!-- 1. BA LAO (GRANNY ANIMATED)                                      -->
  <!-- ================================================================= -->
  <g id="granny">
    <!-- Vet xuoc san ve tay -->
    <path class="fine" stroke="#aab3be" d="M 45,410 L 58,422 L 48,435 L 60,448 L 50,460"/>
    <path class="fine" stroke="#aab3be" d="M 235,360 L 250,385 L 240,405 L 258,430"/>
    <path class="fine" stroke="#aab3be" d="M 260,480 L 275,500 L 265,518 L 280,538"/>

    <!-- Than duoi / Vay (nau sam) -->
    <path class="outline" d="M 96,412 
             C 94,455 96,515 104,565 
             C 107,590 128,600 166,600 
             C 204,600 225,590 228,565 
             C 234,515 234,455 228,412 Z" 
          fill="#61412a"/>

    <!-- Than tren / Ao ba ba (nau sang) -->
    <path class="outline" d="M 112,305 
             C 96,330 92,368 96,412 
             L 228,412 
             C 234,360 226,320 202,305 
             C 180,292 155,296 135,296 
             C 124,296 116,298 112,305 Z" 
          fill="#785338"/>

    <!-- Co ao va vat ao -->
    <path class="med" d="M 112,305 C 124,332 150,332 162,305"/>
    <path class="med" d="M 132,328 C 126,352 128,378 134,412"/>
    <path class="med" d="M 96,412 C 135,424 188,424 228,412"/>

    <!-- Tui ao ben hong phai -->
    <path class="med" d="M 168,362 L 198,362 C 202,362 204,386 200,396 C 196,404 172,404 168,396 C 164,386 164,362 168,362 Z" fill="#61412a"/>

    <!-- Co noi -->
    <path d="M 124,275 L 148,275 L 148,310 L 124,310 Z" fill="#ffede6"/>

    <!-- NHOM DAU BA LAO (Gat gu, noi nang) -->
    <g id="granny-head" transform="translate(18, 12)">
      <!-- Bui toc sau gay -->
      <g id="bun">
        <circle class="outline" cx="216" cy="142" r="30" fill="#9c9c9c"/>
        <path class="med" d="M 204,134 C 218,122 238,130 234,148 C 230,162 214,164 206,152 C 202,146 206,138 214,140"/>
      </g>

      <!-- Khoi dau da mat -->
      <path class="outline" stroke-width="5.5" d="M 68,205 
               C 56,252 82,298 128,302 
               C 174,305 214,272 218,222 
               C 222,160 190,118 135,118 
               C 85,118 72,160 68,205 Z" 
            fill="#ffede6"/>

      <!-- Tai -->
      <path class="outline" stroke-width="4.5" d="M 202,212 C 220,214 222,238 205,242" fill="#ffede6"/>
      <path class="fine" d="M 207,220 C 212,222 212,230 206,232"/>

      <!-- Toc chai nguoc -->
      <path class="outline" stroke-width="5.5" d="M 74,165 
               C 74,130 102,96 156,98 
               C 202,100 226,132 220,188 
               C 216,218 210,250 196,260 
               C 190,264 184,250 186,236 
               C 188,218 192,202 188,188 
               C 182,170 166,155 146,144 
               C 116,126 88,142 74,165 Z" 
            fill="#9c9c9c"/>

      <!-- Lon toc mai -->
      <path class="outline" stroke-width="4.5" d="M 188,188 C 178,200 180,222 183,230 C 185,236 192,234 192,226 C 191,214 192,200 188,188 Z" fill="#9c9c9c"/>

      <!-- Duong chai toc -->
      <path class="med" stroke="#686868" d="M 98,132 C 126,112 168,114 196,128"/>
      <path class="med" stroke="#686868" d="M 120,146 C 146,128 182,134 204,152"/>
      <path class="med" stroke="#686868" d="M 144,162 C 168,152 192,164 204,184"/>
      <path class="med" stroke="#686868" d="M 164,178 C 178,178 192,196 195,216"/>

      <!-- Chan may (nhuc nhich) -->
      <g id="granny-brows">
        <path class="heavy" stroke-width="8" d="M 85,178 C 96,166 116,170 124,184"/>
        <path class="heavy" stroke-width="8" d="M 152,184 C 160,170 180,166 192,178"/>
      </g>

      <!-- Doi mat (chop mat tu nhien) -->
      <g id="granny-eyes">
        <!-- Mat trai -->
        <ellipse class="outline" stroke-width="4.5" cx="104" cy="198" rx="13" ry="11" fill="#ffffff" transform="rotate(-6, 104, 198)"/>
        <circle cx="102" cy="199" r="6" fill="#181818"/>
        <circle cx="100" cy="197" r="2.2" fill="#ffffff"/>
        <path class="outline" stroke-width="4" d="M 72,192 L 82,194"/>
        <path class="outline" stroke-width="4" d="M 71,202 L 81,201"/>

        <!-- Mat phai -->
        <ellipse class="outline" stroke-width="4.5" cx="160" cy="198" rx="13" ry="11" fill="#ffffff" transform="rotate(6, 160, 198)"/>
        <circle cx="158" cy="199" r="6" fill="#181818"/>
        <circle cx="156" cy="197" r="2.2" fill="#ffffff"/>
        <path class="outline" stroke-width="4" d="M 182,198 L 192,195"/>
        <path class="outline" stroke-width="4" d="M 182,206 L 192,207"/>
      </g>

      <!-- Khoe mieng buc tuc (nhap nhay cu dong khi noi) -->
      <g id="granny-mouth">
        <path class="heavy" stroke-width="6.5" d="M 164,228 C 172,238 171,248 167,256"/>
      </g>
    </g>
  </g>


  <!-- ================================================================= -->
  <!-- 2. ONG CHU (MAN ANIMATED)                                         -->
  <!-- ================================================================= -->
  <g id="man">
    <!-- Quan ong tru soc xanh doc -->
    <g id="pants">
      <clipPath id="trousersClipAnim">
        <path d="M 72,460 L 228,460 L 228,575 C 228,590 205,595 150,595 C 95,595 72,590 72,575 Z"/>
      </clipPath>
      <path class="outline" stroke-width="5.5" d="M 72,460 L 228,460 L 228,575 C 228,590 205,595 150,595 C 95,595 72,590 72,575 Z" fill="#6a9ad6"/>
      <g clip-path="url(#trousersClipAnim)">
        <rect x="72" y="450" width="19" height="160" fill="#3f6ea8"/>
        <rect x="110" y="450" width="19" height="160" fill="#3f6ea8"/>
        <rect x="148" y="450" width="19" height="160" fill="#3f6ea8"/>
        <rect x="186" y="450" width="19" height="160" fill="#3f6ea8"/>
        <rect x="224" y="450" width="19" height="160" fill="#3f6ea8"/>
      </g>
      <path class="outline" stroke-width="5.5" d="M 72,460 L 72,575 C 72,590 95,595 150,595 C 205,595 228,590 228,575 L 228,460" fill="none"/>
    </g>

    <!-- Ao len gile co bung phap phong -->
    <g id="man-belly">
      <g id="sweater">
        <path class="outline" stroke-width="5.5" d="M 108,285 
                 C 88,315 58,360 60,415 
                 C 61,440 66,454 72,462 
                 L 228,462 
                 C 230,454 232,430 230,405 
                 C 228,345 215,310 192,285 
                 C 174,270 155,274 142,274 
                 C 128,274 116,272 108,285 Z" 
              fill="#fcf6ce"/>

        <!-- So mi caro co V -->
        <path d="M 118,274 L 148,326 L 178,274 Z" fill="#4d7eb8"/>
        <path class="fine" stroke="#a2c8f6" d="M 124,278 L 156,320 M 138,276 L 166,310"/>
        <path class="fine" stroke="#a2c8f6" d="M 172,278 L 140,320 M 158,276 L 130,310"/>
        <path class="med" d="M 118,274 L 146,306 L 148,276"/>
        <path class="med" d="M 178,274 L 150,306 L 148,276"/>

        <!-- Vien co ao len -->
        <path d="M 112,276 L 148,334 L 184,276 L 174,272 L 148,320 L 122,272 Z" fill="#ffffff" stroke="#181818" stroke-width="2"/>
        <path class="ink" stroke-width="6.5" stroke-dasharray="4,5" d="M 116,274 L 148,328 L 180,274" fill="none"/>
        <path class="med" d="M 112,276 L 148,334 L 184,276" fill="none"/>
        <path class="med" d="M 122,272 L 148,320 L 174,272" fill="none"/>

        <!-- Vien gau ao len -->
        <rect x="72" y="448" width="156" height="14" fill="#ffffff" stroke="#181818" stroke-width="3"/>
        <path class="ink" stroke-width="8.5" stroke-dasharray="6,6" d="M 75,455 L 225,455" fill="none"/>
        <path class="med" d="M 72,448 L 228,448"/>
        <path class="med" d="M 72,462 L 228,462"/>
      </g>
    </g>

    <!-- Co -->
    <path d="M 132,255 L 164,255 L 164,276 L 132,276 Z" fill="#ffede6"/>

    <!-- NHOM DAU ONG CHU (Nghieng dau, giat ria mep) -->
    <g id="man-head" transform="translate(8, 0)">
      <!-- Da mat bau binh -->
      <path class="outline" stroke-width="5.5" d="M 62,175 
               C 58,235 84,280 140,284 
               C 196,280 222,235 218,175 
               C 214,115 192,72 140,72 
               C 88,72 66,115 62,175 Z" 
            fill="#ffede6"/>

      <!-- Tai -->
      <path class="outline" stroke-width="4.5" d="M 215,175 C 232,176 234,205 216,208" fill="#ffede6"/>
      <path class="fine" d="M 218,183 C 224,186 224,198 218,200"/>

      <!-- Toc re ngoi -->
      <path class="outline" stroke-width="5" d="M 86,138 C 70,110 85,82 110,76 C 112,98 104,118 86,138 Z" fill="#181818"/>
      <path class="outline" stroke-width="5.5" d="M 110,76 C 148,68 190,72 220,112 C 236,140 228,194 218,204 C 208,198 206,174 208,162 C 210,135 204,110 182,96 C 155,83 130,86 110,76 Z" fill="#181818"/>
      <path class="outline" stroke-width="4.5" d="M 74,142 C 65,120 72,100 86,88 C 100,78 110,76 110,76 C 110,90 106,116 86,138 C 78,146 74,155 74,166" fill="#181818"/>

      <!-- Chan may -->
      <path class="heavy" stroke-width="8.5" d="M 85,140 C 96,130 115,132 125,142"/>
      <path class="heavy" stroke-width="8.5" d="M 155,142 C 165,132 184,130 195,140"/>
      <path class="fine" stroke-width="3" d="M 148,138 L 152,146"/>

      <!-- Doi mat (chop mat ngo ngac) -->
      <g id="man-eyes">
        <ellipse class="outline" stroke-width="5" cx="106" cy="164" rx="14" ry="12" fill="#ffffff" transform="rotate(-6, 106, 164)"/>
        <path class="fine" stroke-width="2.5" d="M 98,150 C 106,147 114,148 118,152"/>
        <path class="fine" stroke-width="2.5" d="M 98,178 C 105,182 112,182 118,178"/>

        <ellipse class="outline" stroke-width="5" cx="174" cy="164" rx="14" ry="12" fill="#ffffff" transform="rotate(6, 174, 164)"/>
        <path class="fine" stroke-width="2.5" d="M 162,152 C 166,148 174,147 182,150"/>
        <path class="fine" stroke-width="2.5" d="M 162,178 C 168,182 176,182 182,178"/>
      </g>

      <!-- Ria mep (giat giat) -->
      <g id="man-mustache">
        <path class="outline" stroke-width="5" d="M 116,206 C 116,176 164,176 164,206 C 164,210 116,210 116,206 Z" fill="#181818"/>
        <path stroke="#ffede6" stroke-width="2.5" stroke-linecap="round" d="M 132,192 L 132,204"/>
        <path stroke="#ffede6" stroke-width="2.5" stroke-linecap="round" d="M 140,188 L 140,204"/>
        <path stroke="#ffede6" stroke-width="2.5" stroke-linecap="round" d="M 148,192 L 148,204"/>
      </g>

      <!-- Mieng nho -->
      <path class="med" stroke-width="4.5" d="M 128,216 C 138,222 144,222 152,216"/>

      <!-- Nong cam doi -->
      <path class="med" stroke-width="4.5" d="M 122,238 C 135,246 147,246 158,238"/>
    </g>
  </g>
</svg>

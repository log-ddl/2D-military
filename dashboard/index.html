<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video Studio</title>
  <style>
    :root {
      --bg: #0e1116;
      --panel: #161a21;
      --panel-2: #1c212a;
      --line: #262c37;
      --line-hi: #343c4a;
      --text: #e6e9ef;
      --muted: #8a93a3;
      --faint: #5b6473;
      --accent: #4f8cff;
      --green: #3ecf8e;
      --red: #f06464;
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
    button, input, select { font: inherit; color: inherit; }
    button {
      background: var(--panel-2); border: 1px solid var(--line-hi); border-radius: 7px;
      padding: 7px 13px; cursor: pointer; white-space: nowrap;
    }
    button:hover { border-color: #4a5466; }
    button:disabled { opacity: .45; cursor: default; }
    .primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .primary:hover { border-color: #7aa8ff; }
    .danger { color: var(--red); }
    .danger-fill { background: var(--red); border-color: var(--red); color: #fff; font-weight: 600; }
    .ghost { background: transparent; border-color: transparent; color: var(--muted); }
    .ghost:hover { color: var(--text); border-color: var(--line-hi); }
    input, select {
      background: var(--bg); border: 1px solid var(--line-hi); border-radius: 7px; padding: 8px 10px; width: 100%;
    }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    code { font-family: var(--mono); font-size: 12px; color: var(--muted); }

    /* Đầu trang */
    header {
      position: sticky; top: 0; z-index: 10; background: rgba(14,17,22,.92); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .bar { max-width: 1080px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 14px; }
    .bar h1 { font-size: 17px; margin: 0; font-weight: 650; flex: 1; }
    .bar h1 small { color: var(--faint); font-weight: 400; font-size: 13px; margin-left: 8px; }
    .bar input { width: 220px; }

    main { max-width: 1080px; margin: 0 auto; padding: 20px 20px 120px; }
    .live-note {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px; margin-bottom: 14px;
      border: 1px solid #23493a; background: #13241d; border-radius: 9px; color: #b7ecd3;
    }
    .live-note span { flex: 1; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; box-shadow: 0 0 0 3px rgba(62,207,142,.18); }

    /* Danh sách dự án */
    .row {
      display: grid; grid-template-columns: 168px 1fr auto; gap: 18px; align-items: center;
      padding: 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel); margin-bottom: 10px;
      cursor: pointer;
    }
    .row:hover { border-color: var(--line-hi); }
    .row.live { border-color: #2c6b51; }
    .thumb { width: 168px; aspect-ratio: 16/9; border-radius: 7px; background: var(--panel-2); overflow: hidden; display: grid; place-items: center; color: var(--faint); font-size: 12px; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .name { font-size: 15.5px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
    .meta { color: var(--muted); font-size: 13px; margin: 3px 0 9px; }
    .steps { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--faint); }
    .steps b { font-weight: 500; }
    .steps .ok { color: var(--text); }
    .steps .ok::before { content: "✓ "; color: var(--green); }
    .steps .no::before { content: "○ "; }
    .busy { color: var(--accent); font-size: 12.5px; }
    .side { display: flex; gap: 6px; align-items: center; }
    .empty { text-align: center; color: var(--muted); padding: 70px 20px; border: 1px dashed var(--line-hi); border-radius: 12px; }

    /* Menu ⋯ */
    .menu { position: relative; }
    .menu-list {
      position: absolute; right: 0; top: calc(100% + 4px); z-index: 20; min-width: 190px; padding: 5px;
      background: var(--panel-2); border: 1px solid var(--line-hi); border-radius: 9px; box-shadow: 0 12px 30px rgba(0,0,0,.45); display: none;
    }
    .menu-list.open { display: block; }
    .menu-list button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; }
    .menu-list button:hover { background: var(--line); }
    .menu-list hr { border: 0; border-top: 1px solid var(--line-hi); margin: 4px 0; }

    /* Hộp thoại */
    .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
    .backdrop.open { display: flex; }
    .dialog { background: var(--panel); border: 1px solid var(--line-hi); border-radius: 13px; width: min(470px, 100%); padding: 22px; }
    .dialog h2 { margin: 0 0 16px; font-size: 17px; }
    .dialog p { color: var(--muted); margin: 0 0 18px; }
    .field { margin-bottom: 14px; }
    .field > label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
    .hint { font-size: 12px; color: var(--faint); margin-top: 5px; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .seg { display: flex; gap: 6px; }
    .seg button { flex: 1; padding: 7px 4px; }
    .seg button.on { border-color: var(--accent); color: #fff; background: #1d2a44; }
    .inline { display: flex; gap: 8px; }
    .check { display: flex; gap: 8px; align-items: center; font-size: 13.5px; cursor: pointer; }
    .check input { width: auto; }
    .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

    /* Ngăn chi tiết */
    .drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--panel); border-left: 1px solid var(--line-hi);
      z-index: 40; display: flex; flex-direction: column; transform: translateX(100%); transition: transform .18s ease;
    }
    .drawer.open { transform: none; }
    .drawer-head { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
    .drawer-head h2 { margin: 0; font-size: 16px; flex: 1; }
    .drawer-actions { padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--line); }
    .tabs { display: flex; gap: 2px; padding: 0 20px; border-bottom: 1px solid var(--line); }
    .tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; color: var(--muted); padding: 11px 12px; }
    .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
    .stage { flex: 1; overflow: auto; padding: 18px 20px; }
    .stage img, .stage video { width: 100%; border-radius: 8px; display: block; background: #000; }
    .stage .none { color: var(--muted); text-align: center; padding: 50px 10px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
    .tile h4 { margin: 0 0 6px; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; }
    .tile h4 span { color: var(--faint); font-weight: 400; }
    .tile .none { padding: 28px 10px; border: 1px dashed var(--line-hi); border-radius: 8px; font-size: 12.5px; }
    pre.doc { margin: 0; white-space: pre-wrap; font: 12.5px/1.6 var(--mono); color: #c9d1dc; }

    /* Tác vụ nền */
    .jobs {
      position: fixed; right: 16px; bottom: 16px; width: min(520px, calc(100% - 32px)); z-index: 30;
      background: var(--panel); border: 1px solid var(--line-hi); border-radius: 11px; box-shadow: 0 14px 40px rgba(0,0,0,.5); display: none;
    }
    .jobs-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; cursor: pointer; }
    .jobs-head span { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .jobs-body { border-top: 1px solid var(--line); }
    .jobs-tabs { display: flex; gap: 4px; padding: 8px 10px; overflow-x: auto; }
    .jobs-tabs button { font-size: 12px; padding: 4px 9px; }
    .jobs-tabs button.on { border-color: var(--accent); }
    .log { margin: 0; height: 200px; overflow: auto; padding: 8px 12px 12px; font: 11.5px/1.5 var(--mono); color: #b8c0cc; white-space: pre-wrap; }

    .toast {
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 60; display: none;
      background: var(--panel-2); border: 1px solid var(--line-hi); border-radius: 9px; padding: 10px 16px; font-size: 13.5px;
    }
    .toast.err { border-color: var(--red); color: #ffb4b4; }

    @media (max-width: 720px) {
      .row { grid-template-columns: 1fr; }
      .thumb { width: 100%; }
      .bar input { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <h1>Video Studio <small id="root"></small></h1>
      <input id="search" placeholder="Tìm dự án" oninput="renderList()" />
      <button class="primary" onclick="openCreate()">+ Dự án mới</button>
    </div>
  </header>

  <main>
    <div id="liveNote"></div>
    <div id="list"></div>
  </main>

  <!-- Chi tiết dự án -->
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <h2 id="dTitle"></h2>
      <button class="ghost" onclick="closeDrawer()">Đóng</button>
    </div>
    <div class="drawer-actions" id="dActions"></div>
    <div class="tabs" id="dTabs"></div>
    <div class="stage" id="dStage"></div>
  </aside>

  <!-- Tạo dự án -->
  <div class="backdrop" id="createDlg">
    <div class="dialog">
      <h2>Dự án mới</h2>
      <div class="field">
        <label>Tên dự án</label>
        <input id="cId" placeholder="vd: f15_tap1" />
        <div class="hint">chữ thường, số và dấu _, bắt đầu bằng chữ</div>
      </div>
      <div class="field">
        <label>Chủ đề</label>
        <select id="cSkill"></select>
      </div>
      <div class="field">
        <label>Khổ hình</label>
        <div class="seg" id="cFormat"></div>
      </div>
      <div class="field">
        <label>Giọng đọc</label>
        <div class="inline">
          <select id="cVoice" onchange="onVoiceChange()"></select>
          <label class="ghost" style="border:1px solid var(--line-hi); border-radius:7px; padding:7px 12px; cursor:pointer; white-space:nowrap;">
            Tải lên<input type="file" accept=".mp3,.wav,.m4a,.aac,.ogg,.flac" hidden onchange="uploadVoice(this)" />
          </label>
        </div>
        <div class="hint" id="cVoiceHint">Bỏ trống để tạo dự án trống, thêm voice sau.</div>
      </div>
      <div id="cVoiceOpts" hidden>
        <div class="field pair">
          <div><label class="hint" style="margin:0 0 6px; display:block;">Cắt từ giây</label><input id="cFrom" type="number" step="0.1" min="0" placeholder="đầu file" /></div>
          <div><label class="hint" style="margin:0 0 6px; display:block;">Đến giây</label><input id="cTo" type="number" step="0.1" min="0" placeholder="hết file" /></div>
        </div>
        <label class="check"><input type="checkbox" id="cAsr" checked /> Bóc mốc từng từ ngay sau khi tạo</label>
      </div>
      <div class="foot">
        <button onclick="closeDlg('createDlg')">Huỷ</button>
        <button class="primary" id="cBtn" onclick="submitCreate()">Tạo</button>
      </div>
    </div>
  </div>

  <!-- Đổi tên -->
  <div class="backdrop" id="renameDlg">
    <div class="dialog">
      <h2>Đổi tên dự án</h2>
      <div class="field"><input id="rNew" /></div>
      <div class="foot">
        <button onclick="closeDlg('renameDlg')">Huỷ</button>
        <button class="primary" onclick="submitRename()">Lưu</button>
      </div>
    </div>
  </div>

  <!-- Xuất video -->
  <div class="backdrop" id="mp4Dlg">
    <div class="dialog">
      <h2>Xuất video</h2>
      <p>Ra file <code>out/video.mp4</code>. Video dài sẽ mất một lúc; theo dõi ở góc dưới.</p>
      <label class="check" style="margin-bottom:8px;"><input type="checkbox" id="mMusic" checked /> Có nhạc nền</label>
      <label class="check"><input type="checkbox" id="mSfx" checked /> Có tiếng động</label>
      <div class="foot">
        <button onclick="closeDlg('mp4Dlg')">Huỷ</button>
        <button class="primary" onclick="submitMp4()">Xuất</button>
      </div>
    </div>
  </div>

  <!-- Xác nhận có / không -->
  <div class="backdrop" id="askDlg">
    <div class="dialog">
      <h2 id="askTitle"></h2>
      <p id="askText"></p>
      <div class="foot">
        <button onclick="answer(false)">Không</button>
        <button id="askYes" onclick="answer(true)">Có</button>
      </div>
    </div>
  </div>

  <div class="jobs" id="jobs">
    <div class="jobs-head" onclick="logOpen = !logOpen; renderJobs();">
      <span id="jobsSummary"></span>
      <button id="jobCancel" class="danger" onclick="event.stopPropagation(); cancelJob();">Huỷ</button>
      <button class="ghost" onclick="event.stopPropagation(); hideJobs();">Ẩn</button>
    </div>
    <div class="jobs-body" id="jobsBody">
      <div class="jobs-tabs" id="jobsTabs"></div>
      <pre class="log" id="jobsLog"></pre>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const FORMATS = [['16:9', 'Ngang 16:9'], ['9:16', 'Dọc 9:16'], ['1:1', 'Vuông'], ['4:5', '4:5']];
    let S = { projects: [], voices: [], skills: [], jobs: [] };
    let cur = null, tab = null, jobId = null, logOpen = true, jobsHidden = false, format = '16:9', askCb = null, renaming = null, mp4For = null;
    let poll = null;

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const file = (p, rel, t) => `/files/${encodeURIComponent(p)}/${rel}${t ? `?t=${t}` : ''}`;

    function toast(msg, err = false) {
      const el = $('toast');
      el.textContent = msg;
      el.className = 'toast' + (err ? ' err' : '');
      el.style.display = 'block';
      clearTimeout(el._t);
      el._t = setTimeout(() => { el.style.display = 'none'; }, 3500);
    }

    async function post(url, body) {
      try {
        const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
        return await r.json();
      } catch (e) {
        return { ok: false, error: 'Mất kết nối tới dashboard' };
      }
    }

    async function refresh() {
      try {
        const r = await fetch('/api/state');
        const d = await r.json();
        if (d.ok) {
          S = d;
          $('root').textContent = d.root;
          renderList();
          renderJobs();
          if (cur && $('drawer').classList.contains('open')) renderDrawer(false);
        }
      } catch (e) { /* server tắt: thử lại ở lượt sau */ }
      clearTimeout(poll);
      poll = setTimeout(refresh, S.jobs.some(j => j.status === 'running') ? 1200 : 4000);
    }

    const project = (id) => S.projects.find(p => p.id === id);
    const runningJob = (id) => S.jobs.find(j => j.project === id && j.status === 'running');

    function thumb(p) {
      if (p.has_sheet) return file(p.id, 'out/checks/sheet.png', p.sheet_mtime);
      const sc = p.scenes.find(s => s.has_sheet);
      if (sc) return file(p.id, `out/checks/scenes/${sc.id}.png`, sc.sheet_mtime);
      if (p.models.length) return file(p.id, `out/checks/parts/${encodeURIComponent(p.models[0].file)}`, p.models[0].mtime);
      return null;
    }

    function steps(p) {
      const s = (ok, label) => `<b class="${ok ? 'ok' : 'no'}">${label}</b>`;
      return [
        s(p.has_voice, 'Voice'),
        s(p.has_asr, 'Mốc từ'),
        s(p.has_shot_plan, 'Kế hoạch'),
        s(p.scenes_total > 0 && p.scenes_done === p.scenes_total, `Cảnh ${p.scenes_done}/${p.scenes_total}`),
        s(p.has_audio, 'Âm thanh'),
        s(p.has_mp4, 'Video'),
      ].join('');
    }

    function renderList() {
      const live = S.projects.find(p => p.studio_running);
      $('liveNote').innerHTML = live ? `<div class="live-note"><i class="dot"></i><span>Studio đang mở: <b>${esc(live.id)}</b></span>
        <button onclick="openStudio('${esc(live.id)}')">Xem</button><button onclick="stopStudio('${esc(live.id)}')">Tắt</button></div>` : '';

      const q = $('search').value.trim().toLowerCase();
      const list = S.projects.filter(p => !q || p.id.includes(q));
      if (!list.length) {
        $('list').innerHTML = `<div class="empty">${S.projects.length ? 'Không có dự án khớp tìm kiếm.' : 'Chưa có dự án nào.<br><br><button class="primary" onclick="openCreate()">+ Tạo dự án đầu tiên</button>'}</div>`;
        return;
      }
      $('list').innerHTML = list.map(p => {
        const t = thumb(p), job = runningJob(p.id);
        const meta = [p.skill || 'chưa chọn chủ đề', p.size, p.duration ? `${p.duration}s` : 'chưa có voice'].join(' · ');
        return `<div class="row ${p.studio_running ? 'live' : ''}" onclick="openDrawer('${esc(p.id)}')">
          <div class="thumb">${t ? `<img src="${esc(t)}" loading="lazy" alt="" />` : 'chưa có ảnh'}</div>
          <div>
            <div class="name">${p.studio_running ? '<i class="dot"></i>' : ''}${esc(p.id)}</div>
            <div class="meta">${esc(meta)}</div>
            ${job ? `<div class="busy">Đang chạy: ${esc(job.title)}…</div>` : `<div class="steps">${steps(p)}</div>`}
          </div>
          <div class="side" onclick="event.stopPropagation()">
            <button class="${p.studio_running ? '' : 'primary'}" onclick="openStudio('${esc(p.id)}')">${p.studio_running ? 'Xem Studio' : 'Mở Studio'}</button>
            <div class="menu">
              <button class="ghost" onclick="toggleMenu(this)">⋯</button>
              <div class="menu-list">
                <button onclick="openRename('${esc(p.id)}')">Đổi tên</button>
                <button onclick="askCleanOut('${esc(p.id)}')">Dọn ảnh kiểm và video</button>
                <hr />
                <button class="danger" onclick="askDelete('${esc(p.id)}')">Xoá dự án</button>
              </div>
            </div>
          </div>
        </div>`;
      }).join('');
    }

    function toggleMenu(btn) {
      const m = btn.nextElementSibling, was = m.classList.contains('open');
      closeMenus();
      if (!was) m.classList.add('open');
    }
    function closeMenus() { document.querySelectorAll('.menu-list.open').forEach(m => m.classList.remove('open')); }
    document.addEventListener('click', e => { if (!e.target.closest('.menu')) closeMenus(); });

    /* Studio */
    async function openStudio(id) {
      closeMenus();
      const p = project(id);
      if (p && p.studio_running) { window.open(p.studio_url, 'remotion_studio'); return; }
      const win = window.open('about:blank', 'remotion_studio');
      if (win) {
        win.document.write(`<!doctype html><meta charset="utf-8"><title>Đang mở ${esc(id)}…</title>
          <body style="margin:0;background:#0e1116;color:#e6e9ef;font:16px sans-serif;display:grid;place-items:center;height:100vh">Đang mở Studio cho ${esc(id)}…</body>`);
        win.document.close();
      }
      toast(`Đang mở Studio cho ${id}…`);
      const r = await post('/api/studio/start', { id });
      await refresh();
      if (r.ok && r.url) { if (win) win.location.href = r.url; else window.open(r.url, 'remotion_studio'); }
      else { if (win) win.close(); toast(r.error || 'Không mở được Studio', true); }
    }

    async function stopStudio(id) {
      const r = await post('/api/studio/stop', { id });
      toast(r.ok ? `Đã tắt Studio ${id}` : (r.error || 'Lỗi khi tắt Studio'), !r.ok);
      refresh();
    }

    /* Tác vụ nền */
    async function runJob(id, action, extra = {}) {
      const r = await post('/api/job/start', { id, action, ...extra });
      if (!r.ok) { toast(r.error || 'Không chạy được', true); return; }
      jobId = r.job.id; logOpen = true; jobsHidden = false;
      refresh();
    }

    function renderJobs() {
      const box = $('jobs');
      if (!S.jobs.length || jobsHidden && !S.jobs.some(j => j.status === 'running' && j.id === jobId)) { box.style.display = 'none'; return; }
      box.style.display = 'block';
      if (!jobId || !S.jobs.some(j => j.id === jobId)) jobId = S.jobs[0].id;
      const j = S.jobs.find(x => x.id === jobId);
      const mark = { running: '…', done: '✓', error: '✕ lỗi', cancelled: '✕ huỷ' };
      $('jobsSummary').innerHTML = `${j.status === 'running' ? '<i class="dot"></i> ' : ''}${esc(j.title)} <span style="color:var(--faint)">${mark[j.status] || j.status}</span>`;
      $('jobCancel').style.display = j.status === 'running' ? '' : 'none';
      $('jobsBody').style.display = logOpen ? '' : 'none';
      $('jobsTabs').innerHTML = S.jobs.length > 1 ? S.jobs.slice(0, 8).map(x =>
        `<button class="${x.id === jobId ? 'on' : ''}" onclick="jobId='${x.id}'; renderJobs();">${mark[x.status] || ''} ${esc(x.title)}</button>`).join('') : '';
      const log = $('jobsLog'), atEnd = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
      log.textContent = (j.log || []).join('\n');
      if (atEnd || j.status === 'running') log.scrollTop = log.scrollHeight;
    }
    function hideJobs() { jobsHidden = true; $('jobs').style.display = 'none'; }
    async function cancelJob() { await post('/api/job/cancel', { job_id: jobId }); refresh(); }

    /* Hộp thoại */
    function closeDlg(id) { $(id).classList.remove('open'); }
    function ask(title, text, yesLabel, danger, cb) {
      $('askTitle').textContent = title;
      $('askText').textContent = text;
      $('askYes').textContent = yesLabel;
      $('askYes').className = danger ? 'danger-fill' : 'primary';
      askCb = cb;
      $('askDlg').classList.add('open');
    }
    function answer(yes) { closeDlg('askDlg'); const cb = askCb; askCb = null; if (yes && cb) cb(); }

    function askDelete(id) {
      closeMenus();
      ask(`Xoá dự án "${id}"?`, 'Xoá hẳn thư mục dự án, không lấy lại được.', 'Có, xoá', true, async () => {
        const r = await post('/api/project/delete', { id, mode: 'all' });
        toast(r.ok ? `Đã xoá ${id}` : (r.error || 'Xoá thất bại'), !r.ok);
        if (r.ok && cur === id) closeDrawer();
        refresh();
      });
    }
    function askCleanOut(id) {
      closeMenus();
      ask(`Dọn "${id}"?`, 'Xoá ảnh kiểm và video đã xuất trong out/. Code, kế hoạch và tài sản giữ nguyên.', 'Có, dọn', false, async () => {
        const r = await post('/api/project/delete', { id, mode: 'out' });
        toast(r.ok ? `Đã dọn ${id}` : (r.error || 'Dọn thất bại'), !r.ok);
        refresh();
      });
    }

    function openCreate() {
      $('cId').value = ''; $('cFrom').value = ''; $('cTo').value = '';
      $('cSkill').innerHTML = S.skills.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('') + '<option value="">Không chọn</option>';
      fillVoices('');
      format = '16:9'; renderFormats();
      $('createDlg').classList.add('open');
      $('cId').focus();
    }
    function renderFormats() {
      $('cFormat').innerHTML = FORMATS.map(([v, l]) => `<button class="${v === format ? 'on' : ''}" onclick="format='${v}'; renderFormats();">${l}</button>`).join('');
    }
    function fillVoices(selected) {
      $('cVoice').innerHTML = '<option value="">Không có, tạo dự án trống</option>' + S.voices.map(v =>
        `<option value="${esc(v.rel)}" ${v.rel === selected ? 'selected' : ''}>${esc(v.name)} · ${v.duration}s</option>`).join('');
      onVoiceChange();
    }
    function onVoiceChange() {
      const v = $('cVoice').value;
      $('cVoiceOpts').hidden = !v;
      $('cVoiceHint').hidden = !!v;
      if (v && !$('cId').value.trim()) {
        const stem = v.split('/').pop().replace(/\.[^.]+$/, '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').replace(/^(?=[^a-z])/, 'v_');
        if (stem && !project(stem)) $('cId').value = stem;
      }
    }
    async function uploadVoice(input) {
      const f = input.files && input.files[0];
      if (!f) return;
      toast(`Đang tải lên ${f.name}…`);
      try {
        const r = await fetch('/api/voice/upload', { method: 'POST', headers: { 'X-Filename': encodeURIComponent(f.name) }, body: f });
        const d = await r.json();
        input.value = '';
        if (!d.ok) { toast(d.error || 'Tải lên thất bại', true); return; }
        await refresh();
        fillVoices(d.voice);
        toast(`Đã lưu ${d.voice}`);
      } catch (e) { toast('Tải lên thất bại', true); }
    }
    async function submitCreate() {
      const id = $('cId').value.trim(), voice = $('cVoice').value;
      if (!/^[a-z][a-z0-9_]*$/.test(id)) { toast('Tên dự án: chữ thường, số, dấu _, bắt đầu bằng chữ', true); $('cId').focus(); return; }
      $('cBtn').disabled = true;
      const r = await post('/api/project/create', {
        id, voice, skill: $('cSkill').value, format,
        from: voice && $('cFrom').value !== '' ? Number($('cFrom').value) : null,
        to: voice && $('cTo').value !== '' ? Number($('cTo').value) : null,
        run_asr: !!voice && $('cAsr').checked,
      });
      $('cBtn').disabled = false;
      if (!r.ok) { toast(r.error || 'Tạo thất bại', true); return; }
      closeDlg('createDlg');
      if (r.job) { jobId = r.job.id; jobsHidden = false; }
      toast(`Đã tạo ${id}`);
      await refresh();
      openDrawer(id);
    }

    function openRename(id) {
      closeMenus();
      renaming = id;
      $('rNew').value = id;
      $('renameDlg').classList.add('open');
      $('rNew').select();
    }
    async function submitRename() {
      const nid = $('rNew').value.trim();
      const r = await post('/api/project/rename', { old_id: renaming, new_id: nid });
      if (!r.ok) { toast(r.error || 'Đổi tên thất bại', true); return; }
      closeDlg('renameDlg');
      if (cur === renaming) cur = nid;
      toast(`Đã đổi thành ${nid}`);
      refresh();
    }

    function openMp4(id) { mp4For = id; $('mp4Dlg').classList.add('open'); }
    function submitMp4() { closeDlg('mp4Dlg'); runJob(mp4For, 'mp4', { music: $('mMusic').checked, sfx: $('mSfx').checked }); }

    /* Ngăn chi tiết */
    function openDrawer(id) {
      const p = project(id);
      if (!p) return;
      cur = id;
      tab = p.has_mp4 ? 'video' : p.has_sheet ? 'sheet' : p.scenes.some(s => s.has_sheet) ? 'scenes' : p.models.length ? 'parts' : 'plan';
      $('drawer').classList.add('open');
      renderDrawer(true);
    }
    function closeDrawer() { cur = null; $('drawer').classList.remove('open'); }
    function setTab(t) { tab = t; renderDrawer(true); }

    async function renderDrawer(redraw) {
      const p = project(cur);
      if (!p) { closeDrawer(); return; }
      $('dTitle').textContent = p.id;
      const busy = !!runningJob(p.id);
      const a = (label, act, show = true) => show ? `<button ${busy ? 'disabled' : ''} onclick="runJob('${esc(p.id)}', '${act}')">${label}</button>` : '';
      $('dActions').innerHTML = [
        `<button class="primary" onclick="openStudio('${esc(p.id)}')">${p.studio_running ? 'Xem Studio' : 'Mở Studio'}</button>`,
        a('Bóc mốc từ', 'asr', p.has_voice),
        a('Build', 'build'),
        a('Trộn âm thanh', 'audio'),
        a('Chụp ảnh kiểm', 'sheet'),
        `<button ${busy ? 'disabled' : ''} onclick="openMp4('${esc(p.id)}')">Xuất video</button>`,
      ].join('');
      const tabs = [['video', 'Video'], ['sheet', 'Ảnh kiểm'], ['scenes', `Cảnh (${p.scenes_total})`], ['parts', `Part (${p.models.length})`], ['plan', 'Kế hoạch']];
      $('dTabs').innerHTML = tabs.map(([k, l]) => `<button class="${tab === k ? 'on' : ''}" onclick="setTab('${k}')">${l}</button>`).join('');
      if (!redraw) return;
      const st = $('dStage');
      const none = (t) => `<div class="none">${t}</div>`;
      if (tab === 'video') {
        st.innerHTML = p.has_mp4
          ? `<video controls src="${file(p.id, 'out/video.mp4', p.mp4_mtime)}"></video>
             <p style="color:var(--faint); font-size:12.5px;">out/video.mp4 · ${p.mp4_size_mb} MB · <a style="color:var(--accent)" href="${file(p.id, 'out/video.mp4', p.mp4_mtime)}" download="${esc(p.id)}.mp4">Tải về</a></p>`
          : none('Chưa xuất video.');
      } else if (tab === 'sheet') {
        st.innerHTML = p.has_sheet
          ? `<a href="${file(p.id, 'out/checks/sheet.png', p.sheet_mtime)}" target="_blank"><img src="${file(p.id, 'out/checks/sheet.png', p.sheet_mtime)}" /></a>`
          : none('Chưa có ảnh kiểm cả video. Bấm "Chụp ảnh kiểm".');
      } else if (tab === 'scenes') {
        st.innerHTML = p.scenes.length ? `<div class="tiles">${p.scenes.map(s => `<div class="tile">
            <h4>${esc(s.id)} <span>${esc(s.kind)} · ${s.from}–${s.to}s</span></h4>
            ${s.has_sheet ? `<a href="${file(p.id, `out/checks/scenes/${s.id}.png`, s.sheet_mtime)}" target="_blank"><img src="${file(p.id, `out/checks/scenes/${s.id}.png`, s.sheet_mtime)}" /></a>`
              : none(s.has_code ? 'Chưa chụp' : 'Chưa dựng')}
          </div>`).join('')}</div>` : none('Chưa có cảnh. Cảnh nằm trong plan/chapters/ và hiện ở đây sau khi Build.');
      } else if (tab === 'parts') {
        st.innerHTML = p.models.length ? `<div class="tiles">${p.models.map(m => `<div class="tile">
            <h4>${esc(m.name)}</h4>
            <a href="${file(p.id, `out/checks/parts/${encodeURIComponent(m.file)}`, m.mtime)}" target="_blank"><img src="${file(p.id, `out/checks/parts/${encodeURIComponent(m.file)}`, m.mtime)}" /></a>
          </div>`).join('')}</div>` : none('Chưa có ảnh part.');
      } else {
        let story = '';
        if (p.has_shot_plan) {
          try { const r = await fetch(file(p.id, 'plan/STORY.md', Date.now())); if (r.ok) story = await r.text(); } catch (e) { /* bỏ qua */ }
        }
        st.innerHTML = `${p.has_voice ? `<audio controls style="width:100%; margin-bottom:14px;" src="${file(p.id, 'assets/voice/voice.mp3')}"></audio>` : ''}
          ${story ? `<pre class="doc">${esc(story)}</pre>` : none('Chưa có plan/STORY.md.')}`;
      }
    }

    window.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      const open = document.querySelector('.backdrop.open');
      if (open) open.classList.remove('open');
      else if ($('drawer').classList.contains('open')) closeDrawer();
      closeMenus();
    });

    refresh();
  </script>
</body>
</html>
